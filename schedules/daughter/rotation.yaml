# Rotation for a first grader who is not reading yet: decoding practice every day,
# math once a week, letters as the daily anchor. Replace once her phonics sequence is known.
kid: daughter
version: 2
effective_from: 2026-10-26
rows:
  - area: handwriting
    days: [mon, tue, wed, thu, sat, sun]
    role: anchor
  - area: reading_foundations
    days: [mon, tue, wed, thu, sat, sun]
  - area: math
    days: [sat]
  - area: bedtime_reading
    days: [mon, tue, wed, thu, fri, sat, sun]
    outside_block: true
day_modes:
  fri: free
validate:
  budget: error
  pairing: warn
  items_per_day: error
